<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>ぽかぽか村と ぷちっこ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#3b2a20;--paper:#fff8e6;--paper2:#ffefc8;--accent:#ff8a5c;--green:#5cbf5a;--gold:#ffc830;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1b2a;font-family:'DotGothic16','Hiragino Maru Gothic ProN','Meiryo',monospace;color:var(--ink);touch-action:none;overscroll-behavior:none;}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
.px{image-rendering:pixelated;image-rendering:crisp-edges;object-fit:contain;}
.hidden{display:none!important;}
.win{background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:inset 0 0 0 2px #fff,0 4px 0 rgba(0,0,0,.35);}
button{font-family:inherit;color:var(--ink);cursor:pointer;}
.btn{display:inline-block;margin:4px 3px;padding:9px 14px;font-size:15px;background:#fff;border:3px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink);}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.btn:disabled{opacity:.45;}
.btn.gold{background:var(--gold);}
.btn.sub{background:#eee6d6;}
.btn.danger{background:#ff9a8a;}
.desc{font-size:12px;color:#7a6250;}
/* HUD */
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:6px;right:6px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;}
.chip{display:flex;align-items:center;gap:5px;padding:4px 9px;font-size:14px;background:rgba(255,248,230,.94);border:3px solid var(--ink);border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.3);}
.chip img{width:18px;height:18px;image-rendering:pixelated;}
#hTime{font-size:17px;}
#hDate{font-size:12px;color:#7a6250;}
#hleft{display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
#hMail{pointer-events:auto;background:#ffe0e8;}
#hMail span{font-size:12px;}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 6px);left:6px;right:6px;display:flex;gap:5px;z-index:5;}
.bbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;font-size:11px;background:rgba(255,248,230,.96);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.35);}
.bbtn img{width:24px;height:24px;}
.bbtn:active{transform:translateY(2px);}
#toolBtn{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 74px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:0;width:66px;padding:5px 2px 3px;font-size:11px;background:rgba(255,248,230,.96);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 rgba(0,0,0,.35);}
#toolBtn img{width:26px;height:26px;}
#toolBtn.on{background:var(--gold);}
#toolBtn:active{transform:translateY(2px);}
.ok{color:#3a8a3a;}.ng{color:#d8503a;}
.qrow.story{background:#fff4dc;}
.bar.xp div{background:linear-gradient(#9ad8ff,#4aa8e8);}
#houseBar{position:fixed;top:calc(env(safe-area-inset-top) + 52px);right:6px;display:flex;flex-direction:column;gap:2px;z-index:5;}
#houseBar .btn{font-size:13px;padding:6px 10px;}
#decor{position:fixed;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom) + 72px);padding:8px;z-index:6;}
#decorList{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;}
/* dialog */
#dlg{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 74px);min-height:96px;padding:16px 14px 12px;font-size:16px;line-height:1.65;z-index:30;display:flex;flex-direction:column;}
#dlg .dname{position:absolute;top:-17px;left:12px;background:var(--accent);color:#fff;padding:1px 12px;border:3px solid var(--ink);border-radius:8px;font-size:14px;}
#dlg .dpor{position:absolute;top:-70px;right:10px;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:2px;width:70px;height:70px;display:flex;align-items:center;justify-content:center;}
#dlg .dpor img{width:60px;height:60px;}
#dlg .dtext{white-space:pre-wrap;min-height:52px;}
#dlg .dnext{position:absolute;right:14px;bottom:6px;animation:bob .6s infinite alternate;}
#dlg .dchoices{display:flex;flex-wrap:wrap;justify-content:flex-end;margin-top:4px;}
@keyframes bob{to{transform:translateY(3px);}}
/* toast */
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 62px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:40;pointer-events:none;width:92%;}
.toast{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:14px;animation:tin .25s;transition:opacity .4s,transform .4s;}
.toast img{width:22px;height:22px;}
.toast.out{opacity:0;transform:translateY(-8px);}
@keyframes tin{from{transform:scale(.8);opacity:0;}}
/* panels */
#panels{position:fixed;inset:0;z-index:20;pointer-events:none;}
.panel{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 56px);bottom:calc(env(safe-area-inset-bottom) + 72px);display:flex;flex-direction:column;pointer-events:auto;animation:pin .2s;}
@keyframes pin{from{transform:translateY(16px);opacity:0;}}
.phead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:3px dashed #e0cfa8;}
.ptitle{font-size:18px;}
.pclose{font-size:22px;width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;background:#fff;line-height:1;}
.pbody{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.tabs{display:flex;gap:6px;margin-bottom:8px;}
.tab{flex:1;padding:7px;font-size:15px;border:3px solid var(--ink);border-radius:8px;background:#eee6d6;}
.tab.on{background:var(--gold);}
.money{text-align:right;margin-bottom:6px;font-size:15px;}
.money img{vertical-align:middle;}
.note{font-size:13px;margin:8px 0 6px;padding:4px 8px;background:var(--paper2);border-radius:6px;}
.empty{text-align:center;padding:30px 10px;color:#8a7260;line-height:1.8;}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;}
.icell{position:relative;height:56px;border:3px solid var(--ink);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 56px;}
.icell img{width:34px;height:34px;}
.icell.sel{background:var(--gold);}

.mlist{display:flex;flex-direction:column;gap:6px;}
.mrow{display:flex;align-items:center;gap:8px;padding:6px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:10px;}
.mrow img{flex:0 0 40px;}
.minfo{font-size:14px;line-height:1.5;}

.tchip{display:inline-block;padding:0 6px;border-radius:6px;color:#fff;font-size:11px;vertical-align:middle;border:2px solid rgba(0,0,0,.25);}

.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:8px 0 4px;}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;}
.dcell{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 2px 4px;background:#eee6d6;border:3px solid var(--ink);border-radius:10px;min-height:96px;}
.dcell.got{background:#fff;}
.dno{position:absolute;top:2px;left:5px;font-size:10px;color:#8a7260;}

.qrow{padding:10px;margin-bottom:8px;background:#fff;border:3px solid var(--ink);border-radius:10px;}

.paper{white-space:pre-wrap;padding:16px 14px;line-height:2;font-size:15px;background:repeating-linear-gradient(#fffdf6,#fffdf6 29px,#f4d8e0 30px);border:2px solid #f0c8d4;border-radius:6px;}

.slist{display:flex;flex-direction:column;gap:6px;}
.srow{display:flex;align-items:center;gap:8px;padding:6px 8px;background:#fff;border:3px solid var(--ink);border-radius:10px;}

.sale{display:inline-block;margin-left:4px;padding:0 5px;background:#ff6a6a;color:#fff;border-radius:5px;font-size:10px;}
/* overlays */
#overlay{position:fixed;inset:0;z-index:25;pointer-events:none;}
#overlay>*{pointer-events:auto;}
.catch{position:fixed;inset:0;background:rgba(20,16,36,.55);display:flex;align-items:center;justify-content:center;padding:12px;animation:fin .2s;}
@keyframes fin{from{opacity:0;}}
.cbox{width:100%;max-width:360px;padding:12px;text-align:center;}
.cbox canvas{width:100%;max-width:300px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:10px;touch-action:none;}
.ctitle{font-size:16px;margin-bottom:6px;}
.cmsg{margin:6px 0;min-height:22px;font-size:15px;}
.chits{font-size:22px;color:#d8c8b0;letter-spacing:4px;}
.chits .on{color:#ff5a7a;}
.cres{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;}
.cres img{animation:bob .5s infinite alternate;}
.crt{font-size:18px;}
.cnew{color:#ff5a3a;font-weight:bold;animation:bob .4s infinite alternate;display:inline-block;}
.cdesc{font-size:13px;color:#7a6250;line-height:1.6;}
.create label{display:block;margin:8px 0;font-size:15px;}
.create input{font-family:inherit;font-size:18px;padding:6px 10px;width:60%;border:3px solid var(--ink);border-radius:8px;text-align:center;user-select:text;-webkit-user-select:text;}
.prev{display:flex;justify-content:center;}
.prev canvas{width:100px;height:100px;}
.lbl{font-size:13px;margin-top:6px;}
.sw{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0;}
.swc{width:30px;height:30px;border:3px solid var(--ink);border-radius:50%;}
.swc.on{box-shadow:0 0 0 3px var(--gold);}
.starters{display:flex;gap:6px;}
.scard{flex:1;padding:8px 4px;background:#fff;border:3px solid var(--ink);border-radius:10px;font-size:14px;line-height:1.5;}
.scard .desc{font-size:10px;}
.news{width:100%;max-width:380px;max-height:88vh;overflow-y:auto;padding:14px;text-align:left;background:#fffdf4;}
.nhead{font-size:24px;text-align:center;border-bottom:4px double var(--ink);padding-bottom:4px;}
.ndate{text-align:center;font-size:13px;margin:4px 0 8px;color:#7a6250;}
.nsec{padding:6px 2px;border-bottom:1px dashed #d8c8a8;font-size:14px;line-height:1.6;}
.fcs{display:flex;justify-content:space-around;}
.fc{display:flex;flex-direction:column;align-items:center;font-size:11px;}
.fc img{width:28px;height:28px;}
.feat{display:flex;gap:10px;align-items:center;}
.news .btn{display:block;width:100%;margin:8px 0 0;}
.drow{display:flex;gap:10px;align-items:center;}
.drow>img{flex:0 0 40px;}
.dget{display:inline-flex;align-items:center;gap:4px;margin-top:3px;padding:1px 8px 1px 3px;background:var(--paper2);border-radius:10px;font-size:12px;}
.dget img{width:20px;height:20px;}
.omi .btn{margin-top:4px;}
.cbtns{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;}
#camBtn{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 50px);z-index:5;width:46px;height:46px;border-radius:50%;background:rgba(255,248,230,.96);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:0;}
#camBtn:active{transform:translateY(2px);}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0;}
.chipb{padding:6px 9px;font-size:13px;border:2px solid var(--ink);border-radius:14px;background:#fff;}

.chipb:disabled{opacity:.35;}
.chipb.stamp{padding:2px 6px;}
.chipb.stamp img,.chipb.stamp canvas{width:20px;height:20px;max-width:none;border:none;border-radius:0;display:block;}
.pview{width:100%;image-rendering:pixelated;border:3px solid var(--ink);border-radius:6px;touch-action:none;}
.pbig{width:100%;image-rendering:pixelated;border:3px solid var(--ink);border-radius:6px;}
.photo.flash{background:#fff!important;}
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.acell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;background:#fff;border:3px solid var(--ink);border-radius:8px;}
